name: Test miniatura AI

on:
  workflow_dispatch:

jobs:
  miniatura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - name: Genereaza miniatura AI din test_frame.jpg
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 miniaturi_ai.py test_frame.jpg \
            --titlu "AM GASIT GOLEMUL DE COPRU" \
            --out miniatura_test.png
      - uses: actions/upload-artifact@v4
        with:
          name: miniatura-test
          path: miniatura_test.png
          if-no-files-found: ignore
