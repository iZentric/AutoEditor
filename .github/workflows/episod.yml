name: Episod din live
on:
  push:
    paths: [declansa/live.txt]
  workflow_dispatch:
    inputs:
      live_url:
        description: 'URL-ul live-ului/VOD-ului de pe YouTube (sau lasa gol si foloseste release_tag)'
        required: false
        type: string
      max_episoade:
        description: '(OPTIONAL) gol = AI-ul decide cate merita'
        default: ''
        type: string
      max_shorts:
        description: '(OPTIONAL) gol = AI-ul decide cate shorturi'
        default: ''
        type: string
      release_tag:
        description: '(OPTIONAL) reproceseaza un release existent (ex: vod-1) — fara re-upload'
        default: ''
        type: string
  release:
    types: [published]

concurrency:
  group: episod
  cancel-in-progress: true
jobs:
  episod:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instaleaza dependinte
        run: pip install yt-dlp google-genai pillow imageio-ffmpeg faster-whisper scenedetect
      - name: yt-dlp FRESH (build master — YouTube se schimba saptamanal)
        run: pip install --force-reinstall --no-deps https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz
      - name: Aflare sursa (input SAU declansa/live.txt SAU fisier din Release)
        id: afla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.release_tag }}"; fi
          if [ -n "$TAG" ]; then
            case "$TAG" in
              ep-*) echo "Release de EPISOADE ($TAG) - nu reprocesam"; exit 0;;
            esac
            ASSET_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
              | python3 -c "import json,sys; a=json.load(sys.stdin).get('assets',[]); print(a[0]['id'] if a else '')")
            BODY=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('body') or '')")
            if [ -z "$ASSET_ID" ] && [ -z "$BODY" ]; then echo "!! release-ul $TAG nu are fisier atasat nici descriere"; exit 1; fi
            BODY_URL=$(echo "$BODY" | grep -oE 'https?://(www\.)?(youtube\.com/watch\?v=|youtu\.be/|youtube\.com/live/)[A-Za-z0-9_-]{11}' | head -1)
            if [ -n "$BODY_URL" ]; then echo "CTX_URL=$BODY_URL" >> "$GITHUB_ENV"; echo "Context AI: $BODY_URL (din descrierea release-ului)"; fi
            EP_N=$(echo "$BODY" | grep -oiE 'episoad[eu]+[: =]+[0-9]+' | grep -oE '[0-9]+' | head -1)
            SH_N=$(echo "$BODY" | grep -oiE 'short(ur i|uri|s)?[: =]+[0-9]+' | grep -oE '[0-9]+' | head -1)
            if [ -n "$EP_N" ]; then echo "MAX_EP=$EP_N" >> "$GITHUB_ENV"; echo "Creatorul cere $EP_N episoade"; fi
            if [ -n "$SH_N" ]; then echo "MAX_SH=$SH_N" >> "$GITHUB_ENV"; echo "Creatorul cere $SH_N shorturi"; fi
            echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
            if [ -n "$ASSET_ID" ]; then
              echo "ASSET_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"
              URL="https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
              echo "Sursa: fisierul din release $TAG (asset $ASSET_ID)"
            elif [ -n "$BODY_URL" ]; then
              URL="$BODY_URL"
              echo "Niciun fisier atasat -> descarc DIRECT de pe YouTube: $BODY_URL"
            else
              echo "!! release-ul $TAG nu are fisier atasat nici link YouTube in descriere"; exit 1
            fi
            # CONTEXT PENTRU AI: descrierea release-ului (link + notiza creatorului)
            printf '%s' "$BODY" > context_creator.txt
            # daca e link YouTube in descriere, luam si titlul/descrierea oficiala (oEmbed, fara cookies)
            YT_ID=$(printf '%s' "$BODY" | grep -oE '(v=|/live/|youtu\.be/)[A-Za-z0-9_-]{11}' | head -1 | grep -oE '[A-Za-z0-9_-]{11}$')
            if [ -n "$YT_ID" ]; then
              curl -s --max-time 20 "https://www.youtube.com/oembed?url=https%3A//www.youtube.com/watch%3Fv%3D$YT_ID&format=json" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print('TITLUL OFICIAL AL LIVE-ULUI:', d.get('title')); print('CANALUL:', d.get('author_name'))" \
                >> context_creator.txt 2>/dev/null || true
            fi
            echo "AE_CONTEXT=$(pwd)/context_creator.txt" >> "$GITHUB_ENV"
            echo "── context pt AI ──"; cat context_creator.txt
          else
            URL="${{ inputs.live_url }}"
            if [ -z "$URL" ] && [ -f declansa/live.txt ]; then URL=$(tr -d '[:space:]' < declansa/live.txt); fi
            if [ -z "$URL" ]; then echo "nicio sursa"; exit 1; fi
          fi
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "vodkey=vod-$(echo -n "$URL" | md5sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Cache sursa descarcata (re-run = fara re-descarcare)
        uses: actions/cache@v4
        with:
          path: live_curent.mp4
          key: ${{ steps.afla.outputs.vodkey }}
      - name: Invata TRENDING RO (RSS canale top — gratis, fara chei)
        run: |
          mkdir -p cunoastere
          python3 invata_trending.py || echo "(trending n/a — continuam fara)"
      - name: Cookies YouTube (Secret COOKIES_YT sau cookies.b64 din repo)
        env:
          COOKIES_YT: ${{ secrets.COOKIES_YT }}
        run: |
          if [ -n "$COOKIES_YT" ]; then printf '%s' "$COOKIES_YT" > cookies.txt; echo "cookies din Secret";
          grep -q SAPISID cookies.txt 2>/dev/null && echo "cookies COMPLETE (au SAPISID) ✓" || echo "!! cookies INCOMPLETE (fara SAPISID) - re-exporta!"
          elif [ -f cookies.b64 ]; then base64 -d cookies.b64 > cookies.txt; echo "cookies din repo (b64)";
          else echo "fara cookies"; fi
      - name: Randare episoade (descarcare -> analiza -> episoade -> 2K)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash,gemini-3.5-flash,gemini-3.8-flash,gemini-flash-latest
          AE_POARTA: '0.6'
          ASSET_TOKEN: ${{ env.ASSET_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SUBTITRARI: '1'   # TOT PACHETUL: subtitrari .srt per episod (whisper local, gratis)
          MAX_SH: ${{ env.MAX_SH || inputs.max_shorts || 'auto' }}
        run: python3 pipeline_github.py "$URL" "${{ env.MAX_EP || inputs.max_episoade || 'auto' }}"
      - name: Publica in Releases (gata de download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(episodes/EP*.mp4)
          if [ ${#files[@]} -eq 0 ]; then echo "nu sunt episoade de publicat"; exit 0; fi
          if [ -n "$RELEASE_TAG" ]; then
            # LIVRARE PE RAND: piesele mari au urcat deja (cu nume din titlu); aici se urca RESTUL
            TAG="$RELEASE_TAG"
            python3 nume_public.py
            gh release upload "$TAG" episodes/* --clobber
            echo "restul fisierelor urcate pe $TAG (cu numele din titluri)"
          else
            TAG="ep-$(date -u +%Y%m%d-%H%M)"
            python3 nume_public.py
            gh release create "$TAG" episodes/* \
              --title "Episoade $TAG" --notes "Episoade 2K + SHORTS verticale gata de upload pe YouTube. Vezi *_upload.txt pentru titlu/descriere/tag-uri."
          fi
          echo "TAG_PUBLISH=$TAG" >> "$GITHUB_ENV"
      - name: MEMORIE — titlurile proprii intra in creier (nu le mai repeta niciodata)
        run: |
          mkdir -p cunoastere
          touch cunoastere/titluri_folosite.txt
          for f in episodes/EP*_upload.txt; do
            [ -f "$f" ] && head -1 "$f" | sed 's/^TITLU:\s*//' >> cunoastere/titluri_folosite.txt
          done
          sort -u -o cunoastere/titluri_folosite.txt cunoastere/titluri_folosite.txt
          git config user.email "agent@autoeditor.local" && git config user.name "AutoEditor Agent"
          git add cunoastere/ && git commit -m "memorie: titluri publicate la ${TAG_PUBLISH:-auto}" || echo "(nimic nou de memorat)"
          git push || echo "(push memorie skip)"
      - name: NOTIFICARE — TITLU + LINK download direct (click = se salveaza pe PC)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "**TITLU + DOWNLOAD (click -> se salveaza pe PC):**"
            for f in episodes/*_upload.txt; do
              [ -f "$f" ] || continue
              baza=$(basename "$f" _upload.txt)
              titlu=$(head -1 "$f" | sed 's/^TITLU:\s*//')
              vf=""
              for cand in episodes/$baza.mp4 episodes/$baza*.mp4; do
                [ -f "$cand" ] && vf=$(basename "$cand") && break
              done
              [ -z "$vf" ] && continue
              enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$vf")
              echo "- **$titlu** -> [DESCARCA $vf](https://github.com/${{ github.repository }}/releases/download/${TAG_PUBLISH:-vod-1}/$enc)"
            done
          } > mesaj_livrare.md
          cat mesaj_livrare.md
          if gh issue list --search "EPISOADE GATA in:title" --state open --json number -q '.[0].number' 2>/dev/null | grep -q .; then
            N=$(gh issue list --search "EPISOADE GATA in:title" --state open --json number -q '.[0].number')
            gh issue comment "$N" --body-file mesaj_livrare.md
          else
            gh issue create --title "EPISOADE GATA — episod nou livrat" --body-file mesaj_livrare.md || true
          fi
